name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-mlx-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m pip install "openai==2.52.0"
      # The Libraxis branch owns Responses through protocols/responses and
      # GenerationTurn, including store/lineage/cancellation. The upstream
      # stateless adapter is not mounted and has an incompatible contract.
      - run: python -m pytest tests/test_no_mlx_imports.py tests/test_public_cli.py tests/test_runtime_kpis.py tests/test_server_openai.py tests/test_responses_api.py tests/test_responses_sdk.py tests/test_response_store.py tests/test_generation_turn_events.py tests/test_endpoint_probe_hygiene.py tests/test_openai_bridge.py tests/test_thermal.py tests/test_cache_state.py tests/test_aria2_downloader.py tests/test_web_tools.py
      - run: python -m compileall -q mtplx tests
